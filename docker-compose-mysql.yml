version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: my-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: apdddbs19
      MYSQL_DATABASE: choroid_db
      MYSQL_USER: choroid_user
      MYSQL_PASSWORD: choroid_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password
    networks:
      - choroid-network

volumes:
  mysql_data:

networks:
  choroid-network:
    driver: bridge