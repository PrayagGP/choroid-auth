<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Choroid Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .update-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }

        .update-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .update-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .update-header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            color: #333;
            font-weight: 700;
        }

        .update-header p {
            color: #666;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        .btn-update {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-update:active {
            transform: translateY(0);
        }

        .btn-update:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-update.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .btn-update.loading {
            color: transparent;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            font-size: 14px;
            display: none;
        }

        .password-requirements {
            background: #e2e3f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .password-requirements h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .password-requirements ul {
            color: #666;
            padding-left: 20px;
        }

        .password-requirements li {
            margin-bottom: 5px;
        }

        @media (max-width: 480px) {
            .update-container {
                padding: 30px 25px;
                margin: 10px;
            }
            
            .update-header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="update-container">
        <div class="update-header">
            <h1>🔐 Update Password</h1>
            <p>Change your account password</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div class="password-requirements">
            <h4>Password Requirements:</h4>
            <ul>
                <li>Minimum 6 characters long</li>
                <li>Must enter current password for verification</li>
                <li>New password and confirmation must match</li>
            </ul>
        </div>

        <form id="updatePasswordForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter your current password" required>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Enter your new password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your new password" required>
            </div>

            <button type="submit" class="btn-update" id="updateButton">Update Password</button>
        </form>

        <div class="back-link">
            <p>Go back to <a href="login.html">Login Page</a> or <a href="dashboard.html">Dashboard</a></p>
        </div>
    </div>

    <script>
        // API Configuration - Choose one based on your setup
        
        // Option 1: Local Development (Gateway is down)
        //const API_BASE_URL = 'http://localhost:8080/api/auth';
        
        // Option 2: CORS Proxy (Uncomment when gateway is up)
        const API_BASE_URL = 'http://localhost:3001/api/auth';

        // Setup form handler
        document.getElementById('updatePasswordForm').addEventListener('submit', handleUpdatePassword);

        async function handleUpdatePassword(event) {
            event.preventDefault();
            
            const updateButton = document.getElementById('updateButton');
            const username = document.getElementById('username').value.trim();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Client-side validation
            if (!username || !currentPassword || !newPassword || !confirmPassword) {
                showError('Please fill in all fields');
                return;
            }

            if (newPassword.length < 6) {
                showError('New password must be at least 6 characters long');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('New password and confirmation do not match');
                return;
            }

            if (currentPassword === newPassword) {
                showError('New password must be different from current password');
                return;
            }

            // Show loading state
            updateButton.classList.add('loading');
            updateButton.disabled = true;
            hideMessages();

            try {
                const response = await fetch(`${API_BASE_URL}/update-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        currentPassword: currentPassword,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Password updated successfully! Redirecting to login page...');
                    
                    // Clear form
                    document.getElementById('updatePasswordForm').reset();
                    
                    // Clear any stored authentication data
                    localStorage.removeItem('jwt_token');
                    localStorage.removeItem('username');
                    localStorage.removeItem('refresh_token');
                    
                    // Redirect to login page after a brief delay
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);

                } else {
                    showError(data.message || data.error || 'Password update failed. Please check your current password.');
                }

            } catch (error) {
                console.error('Update password error:', error);
                showError('Network error. Please check if the service is running.');
            } finally {
                // Remove loading state
                updateButton.classList.remove('loading');
                updateButton.disabled = false;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Auto-populate username if available from storage
        window.addEventListener('DOMContentLoaded', function() {
            const storedUsername = localStorage.getItem('username');
            if (storedUsername) {
                document.getElementById('username').value = storedUsername;
            }
        });
    </script>
</body>
</html>
