# ========================================
# MULTI-SERVICE API GATEWAY CONFIGURATION
# ========================================
# Your friend's gateway can route to multiple services from different people

server.port=8080

# ========================================
# SERVICE 1: YOUR AUTH SERVICE  
# ========================================
spring.cloud.gateway.routes[0].id=your-auth-service
spring.cloud.gateway.routes[0].uri=http://25.36.98.227:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=your-auth-ui
spring.cloud.gateway.routes[1].uri=http://25.36.98.227:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# ========================================
# SERVICE 2: ANOTHER FRIEND'S SERVICE (e.g., User Management)
# ========================================
spring.cloud.gateway.routes[2].id=friend2-user-service
spring.cloud.gateway.routes[2].uri=http://25.45.123.456:8090
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=friend2-user-ui
spring.cloud.gateway.routes[3].uri=http://25.45.123.456:8090
spring.cloud.gateway.routes[3].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# ========================================
# SERVICE 3: THIRD FRIEND'S SERVICE (e.g., Payment Service)
# ========================================
spring.cloud.gateway.routes[4].id=friend3-payment-service
spring.cloud.gateway.routes[4].uri=http://25.67.234.789:8080
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[5].id=friend3-payment-ui
spring.cloud.gateway.routes[5].uri=http://25.67.234.789:8080
spring.cloud.gateway.routes[5].predicates[0]=Path=/payments/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

# ========================================
# SERVICE 4: FOURTH FRIEND'S SERVICE (e.g., Notification Service)
# ========================================
spring.cloud.gateway.routes[6].id=friend4-notification-service
spring.cloud.gateway.routes[6].uri=http://25.89.111.222:3000
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1

# ========================================
# CORS CONFIGURATION
# ========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# ========================================
# MAIN DASHBOARD (Optional - Your friend's own service)
# ========================================
spring.cloud.gateway.routes[7].id=main-dashboard
spring.cloud.gateway.routes[7].uri=http://localhost:3000
spring.cloud.gateway.routes[7].predicates[0]=Path=/
spring.cloud.gateway.routes[7].filters[0]=RedirectTo=302, http://localhost:8080/dashboard.html

# ========================================
# HEALTH CHECK AGGREGATION
# ========================================
spring.cloud.gateway.routes[8].id=health-aggregator
spring.cloud.gateway.routes[8].uri=http://localhost:8080
spring.cloud.gateway.routes[8].predicates[0]=Path=/health/**