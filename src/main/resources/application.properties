# Application Configuration
spring.application.name=Choroid-Authentication-and-Authorization-Service
server.port=${SERVER_PORT:8080}

# Database Configuration - Docker MySQL Container
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/choroid_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:apdddbs19}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC Configuration
# Using pure JDBC - no JPA/Hibernate configuration needed

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Logging Configuration
logging.level.com.ddbs.choroid_auth_service=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=${ADMIN_ROLES:ADMIN}
