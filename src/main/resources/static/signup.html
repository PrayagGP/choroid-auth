<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Choroid Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .signup-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .signup-header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            color: #333;
            font-weight: 700;
        }

        .signup-header p {
            color: #666;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f5576c;
            background: white;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
            transform: translateY(-1px);
        }

        .btn-signup {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        .btn-signup:active {
            transform: translateY(0);
        }

        .btn-signup:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-signup.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .btn-signup.loading {
            color: transparent;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .login-link a {
            color: #f5576c;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #f093fb;
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            font-size: 14px;
            display: none;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 25px;
                margin: 10px;
            }
            
            .signup-header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>📝 Create Account</h1>
            <p>Join the Choroid Authentication System</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3" maxlength="50" autofocus>
                <div class="password-requirements">
                    Must be 3-50 characters. Letters, numbers, dots, underscores, and hyphens allowed.
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a secure password" required minlength="6">
                <div class="password-requirements">
                    Must be at least 6 characters long. Use a strong password for better security.
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required minlength="6">
            </div>

            <button type="submit" class="btn-signup" id="signupButton">Create Account</button>
        </form>

        <div class="login-link">
            <p>Already have an account? <a href="login.html">Sign in here</a></p>
        </div>
    </div>

    <script>
        // Smart API URL detection - Check if accessed via gateway port or proxy port
        const isDirectGateway = window.location.port === '8100' || window.location.port === '8080' || window.location.port === '';
        const API_BASE_URL = isDirectGateway ? '/api/auth' : 'http://localhost:8080/api/auth';
        
        console.log('Current URL:', window.location.href);
        console.log('Port:', window.location.port);
        console.log('Access method:', isDirectGateway ? 'Direct Gateway (Port 8100)' : 'Local Proxy/File');
        console.log('API Base URL:', API_BASE_URL);
               // Setup form handler
               document.getElementById('signupForm').addEventListener('submit', handleSignup);

               // Real-time password confirmation validation
               document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

               async function handleSignup(event) {
                   event.preventDefault();

                   const signupButton = document.getElementById('signupButton');
                   const username = document.getElementById('username').value.trim();
                   const password = document.getElementById('password').value;
                   const confirmPassword = document.getElementById('confirmPassword').value;

                   // Validation
                   if (!username || !password || !confirmPassword) {
                       showError('Please fill in all fields');
                       return;
                   }

                   if (password !== confirmPassword) {
                       showError('Passwords do not match');
                       return;
                   }

                   if (username.length < 3 || username.length > 50) {
                       showError('Username must be between 3 and 50 characters');
                       return;
                   }

                   if (password.length < 6) {
                       showError('Password must be at least 6 characters long');
                       return;
                   }

                   // Check username format
                   const usernameRegex = /^[a-zA-Z0-9._-]+$/;
                   if (!usernameRegex.test(username)) {
                       showError('Username can only contain letters, numbers, dots, underscores, and hyphens');
                       return;
                   }

                   // Show loading state
                   signupButton.classList.add('loading');
                   signupButton.disabled = true;
                   hideMessages();

                   try {
                       const response = await fetch(`${API_BASE_URL}/signup`, {
                           method: 'POST',
                           headers: {
                               'Content-Type': 'application/json'
                           },
                           body: JSON.stringify({ username, password })
                       });

                       const data = await response.json();

                       if (response.ok) {
                           showSuccess('Account created successfully! Redirecting to login...');

                           // Clear the form
                           document.getElementById('signupForm').reset();

                           // Redirect to login after a brief delay
                           setTimeout(() => {
                               window.location.href = 'login.html';
                           }, 2000);

                       } else {
                           // Handle different error types
                           if (response.status === 409) {
                               showError('Username already exists. Please choose a different username.');
                           } else if (data.validationErrors) {
                               // Handle validation errors
                               const errorMessages = Object.values(data.validationErrors).join(', ');
                               showError('Validation errors: ' + errorMessages);
                           } else {
                               showError(data.message || 'Registration failed. Please try again.');
                           }
                       }

                   } catch (error) {
                       console.error('Signup error:', error);
                       showError('Network error. Please check if the service is running.');
                   } finally {
                       // Remove loading state
                       signupButton.classList.remove('loading');
                       signupButton.disabled = false;
                   }
               }

               function checkPasswordMatch() {
                   const password = document.getElementById('password').value;
                   const confirmPassword = document.getElementById('confirmPassword').value;
                   const confirmInput = document.getElementById('confirmPassword');

                   if (confirmPassword && password !== confirmPassword) {
                       confirmInput.style.borderColor = '#dc3545';
                   } else {
                       confirmInput.style.borderColor = '#e0e0e0';
                   }
               }

               function showError(message) {
                   const errorDiv = document.getElementById('errorMessage');
                   errorDiv.textContent = message;
                   errorDiv.style.display = 'block';

                   // Scroll to top to show error
                   window.scrollTo(0, 0);
               }

               function showSuccess(message) {
                   const successDiv = document.getElementById('successMessage');
                   successDiv.textContent = message;
                   successDiv.style.display = 'block';

                   // Scroll to top to show success
                   window.scrollTo(0, 0);
               }

               function hideMessages() {
                   document.getElementById('errorMessage').style.display = 'none';
                   document.getElementById('successMessage').style.display = 'none';
               }

               // Check if user is already logged in
               window.addEventListener('DOMContentLoaded', function() {
                   const token = localStorage.getItem('jwt_token');
                   const username = localStorage.getItem('username');

                   if (token && username) {
                       // User is already logged in, redirect to dashboard
                       window.location.href = `dashboard.html?user=${encodeURIComponent(username)}`;
                   }
               });
    </script>
</body>
</html>
